/* Full-page CRT overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 9997;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.025) 0,

            rgba(0, 0, 0, 0.08) 4px

    animation: crtScanMove 8s linear infinite;
}

/* Slowly moving VCR brightness band */
body::after {
    content: "";
    position: fixed;
    left: 0;
    top: -35%;
    z-index: 9998;

    width: 100%;
    height: 30%;

    pointer-events: none;

    background: linear-gradient(
        to bottom,

        rgba(255, 255, 255, 0.025),

        const nativeSetTimeout = window.setTimeout.bind(window);
        const activeTimeouts = new Set();

        window.setTimeout = function(callback, delay, ...args) {
            let timeoutId = null;

            timeoutId = nativeSetTimeout(() => {
                activeTimeouts.delete(timeoutId);
                callback(...args);
            }, delay);

            activeTimeouts.add(timeoutId);
            return timeoutId;
        };

        function clearAllTrackedTimeouts() {
            activeTimeouts.forEach(timeoutId => clearTimeout(timeoutId));
            activeTimeouts.clear();
        }

        function safelyPlay(audio, volume = 1, restart = true) {
            if (!audio) {
                return;
            }

            audio.volume = volume;

            if (restart) {
                audio.currentTime = 0;
            }

            const playAttempt = audio.play();

            if (playAttempt !== undefined) {
                playAttempt.catch(() => {});
            }
        }

        function fadeAudio(audio, targetVolume, duration, pauseWhenDone = false) {
            if (!audio) {
                return;
            }

            if (audio._fadeTimer) {
                clearInterval(audio._fadeTimer);
            }

            const startVolume = audio.volume;
            const difference = targetVolume - startVolume;
            const startedAt = performance.now();

            audio._fadeTimer = setInterval(() => {
                const elapsed = performance.now() - startedAt;
                const progress = Math.min(elapsed / duration, 1);

                audio.volume = Math.max(
                    0,
                    Math.min(1, startVolume + difference * progress)
                );

                if (progress >= 1) {
                    clearInterval(audio._fadeTimer);
                    audio._fadeTimer = null;

                    if (pauseWhenDone && targetVolume === 0) {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                }
            }, 40);
        }

        function unlockAudio(audio) {
            if (!audio) {
                return;
            }

            const originalVolume = audio.volume;
            audio.volume = 0;

            const attempt = audio.play();

            if (attempt !== undefined) {
                attempt
                    .then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                        audio.volume = originalVolume;
                    })
                    .catch(() => {
                        audio.volume = originalVolume;
                    });
            }
        }

        function startFirstVoiceAtmosphere() {
            depthsBackground.classList.add("visible");

            /*
            The track was started silently by CLICK TO BEGIN.
            Only now does it fade in audibly.
            */
            if (myCastleMusic.paused) {
                myCastleMusic.volume = 0;

                const attempt = myCastleMusic.play();

                if (attempt !== undefined) {
                    attempt
                        .then(() => {
                            fadeAudio(myCastleMusic, 0.52, 10000);
                        })
                        .catch(() => {});
                }

                return;
            }

            fadeAudio(myCastleMusic, 0.52, 10000);
        }

            }

            eramFinishPlayed = true;
            safelyPlay(eramFinishSound, 0.7);
        }

        function clearCurrentDialogue() {
    if (currentVoice === 1) {
        dialogue.textContent = "";
    } else {
        eramRed.textContent = "";
        eramCyan.textContent = "";
        eramWhite.textContent = "";
    }
}
function typeStartPrompt() {
    const prompt = startPromptText;
    const text = "CLICK TO BEGIN";

    prompt.classList.add("visible");

    let index = 0;

    prompt.textContent = "";
    prompt.classList.remove("ready");

    function typeNextLetter() {
      if (index >= text.length) {
      prompt.classList.add("ready");
      titleSequenceReady = true;
      return;
      }

        prompt.textContent += text[index];
        index++;

        setTimeout(
            typeNextLetter,
            70
        );
    }

    setTimeout(
        typeNextLetter,
        1200
    );
}

function startTitleSequence() {
    if (titleSequenceStarted) {
        return;
    }

    titleSequenceStarted = true;

    /* The save point is the first visible interaction. */
    savePointButton.classList.add("hidden");

    /*
    Do not unlock the music on the save-point click.
    On iOS this can cause playback before the title screen.
    */

    /* Start the full cymbal build-up from the user's click. */
    safelyPlay(buildUpSound, 0.8);

    buildUpSound.addEventListener("ended", () => {
        savePointButton.style.display = "none";

        titleScreenLogo.classList.add("visible");
        safelyPlay(titleSound, 0.8);

        typeStartPrompt();
    }, { once: true });
}

function addCharacterToDialogue(character) {
    if (currentVoice === 1) {
        dialogue.textContent += character;
    } else {
        eramRed.textContent += character;
        eramCyan.textContent += character;
        eramWhite.textContent += character;
    }
}

function showCompleteDialogue(text) {
    if (currentVoice === 1) {
        dialogue.textContent = text;
    } else {
        eramRed.textContent = text;
        eramCyan.textContent = text;
        eramWhite.textContent = text;
    }
}

function showCurrentDialogue() {
    if (currentVoice === 1) {
        dialogue.classList.remove("hidden");
    } else {
        eramDialogue.classList.remove("hidden");
    }
}

function hideCurrentDialogue() {
    if (currentVoice === 1) {
        dialogue.classList.add("hidden");
    } else {
        eramDialogue.classList.add("hidden");
    }
}
function typeCurrentMessage() {
    clearTimeout(typingTimer);

    const currentMessage = messages[messageIndex];

    showCurrentDialogue();
    clearCurrentDialogue();

    characterIndex = 0;
    isTyping = true;
    eramFinishPlayed = false;

    function typeNextCharacter() {
        if (characterIndex >= currentMessage.length) {
            isTyping = false;

            if (currentVoice === 2) {
                playEramFinishSound();
            }

            return;
        }

        const character = currentMessage[characterIndex];

        addCharacterToDialogue(character);

        if (currentVoice === 2) {
            playEramTalkingSound(character);
        } else {
            playTextSound(character);
        }

        characterIndex++;

        typingTimer = setTimeout(
            typeNextCharacter,
            typingSpeed
        );
    }

    typeNextCharacter();
}

function finishCurrentMessage() {
    clearTimeout(typingTimer);

    showCompleteDialogue(messages[messageIndex]);
    characterIndex = messages[messageIndex].length;
    isTyping = false;

    if (currentVoice === 2) {
        playEramFinishSound();
    }
}

        function advanceDialogue() {
            if (
              !hasStarted || 
              isTransitioning ||
              recommendationsActive
              ) {
                return;
              }

            /*
            First click while typing:
            show the entire current message.
            */
            if (isTyping) {
                finishCurrentMessage();
                return;
            }

            /*
            Second click:
            fade out and continue.
            */
            isTransitioning = true;
            hideCurrentDialogue();

            setTimeout(() => {
                messageIndex++;

if (messageIndex >= messages.length) {
    if (currentVoice === 1) {
        beginSecondVoice();
        return;
    }

    window.location.href = nextPage;
    return;
}
                typeCurrentMessage();
                isTransitioning = false;
            }, transitionPause);
        }

function stopAudioImmediately(audio) {
    if (!audio) return;

    if (audio._fadeTimer) {
        clearInterval(audio._fadeTimer);
        audio._fadeTimer = null;
    }

    audio.pause();

    try {
        audio.currentTime = 0;
    } catch (error) {}
}

function resetForDevelopmentJump() {
    clearAllTrackedTimeouts();
    clearTimeout(typingTimer);
    typingTimer = null;

    isTyping = false;
    isTransitioning = false;
    recommendationsActive = false;
    hasStarted = true;
    titleSequenceStarted = true;
    titleSequenceReady = true;
    eramFinishPlayed = false;

    [
        myCastleMusic,
        eramMusic,
        textSound,
        eramTalkingSound,
        eramFinishSound,
        buildUpSound,
        titleSound
    ].forEach(stopAudioImmediately);

    startScreen.classList.add("fadeOut");
    startScreen.style.display = "none";

    const recommendationScreen =
        document.getElementById("recommendationScreen");

    if (recommendationScreen) {
        recommendationScreen.classList.remove("visible");
        recommendationScreen.style.display = "none";
    }

    dialogue.textContent = "";
    eramRed.textContent = "";
    eramCyan.textContent = "";
    eramWhite.textContent = "";

    dialogue.classList.remove("hidden");
    eramDialogue.classList.remove("hidden");
}

function jumpToFirstVoice() {
    resetForDevelopmentJump();

    currentVoice = 1;
    messages = firstVoiceMessages;
    messageIndex = 0;
    characterIndex = 0;

    eramDialogue.style.display = "none";
    dialogue.style.display = "block";
    depthsBackground.classList.add("visible");

    myCastleMusic.loop = true;
    myCastleMusic.volume = 0;

    const attempt = myCastleMusic.play();

    if (attempt !== undefined) {
        attempt
            .then(() => fadeAudio(myCastleMusic, 0.52, 1200))
            .catch(() => {});
    }

    typeCurrentMessage();
}

function jumpToEram() {
    resetForDevelopmentJump();

    currentVoice = 2;
    messages = secondVoiceMessages;
    messageIndex = 0;
    characterIndex = 0;

    dialogue.style.display = "none";
    eramDialogue.style.display = "block";
    depthsBackground.classList.remove("visible");

    eramMusic.loop = true;
    eramMusic.volume = 0;

    const attempt = eramMusic.play();

    if (attempt !== undefined) {
        attempt
            .then(() => fadeAudio(eramMusic, 0.50, 1200))
            .catch(() => {});
    }

    typeCurrentMessage();
}

function beginSecondVoice() {
    currentVoice = 2;
    messages = secondVoiceMessages;

    messageIndex = 0;
    characterIndex = 0;

    dialogue.style.display = "none";
    eramDialogue.style.display = "block";

    clearCurrentDialogue();

    depthsBackground.classList.remove("visible");

    fadeAudio(myCastleMusic, 0, 3500, true);

    setTimeout(() => {
        eramMusic.pause();
        eramMusic.currentTime = 0;
        eramMusic.loop = true;
        eramMusic.volume = 0;

        const attempt = eramMusic.play();

        if (attempt !== undefined) {
            attempt
                .then(() => {
                    fadeAudio(eramMusic, 0.50, 3200);
                })
                .catch(() => {});
        }

        typeCurrentMessage();
        isTransitioning = false;
    }, 3500);
}
function beginExperience() {
    if (hasStarted) {
        return;
    }

    hasStarted = true;
    recommendationsActive = true;

    safelyPlay(selectSound, 0.85);

    /*
    Start the first track silently from this user click.
    It stays at zero until the first-voice atmosphere begins.
    */
    myCastleMusic.pause();
    myCastleMusic.currentTime = 0;
    myCastleMusic.volume = 0;

    const firstMusicAttempt = myCastleMusic.play();

    if (firstMusicAttempt !== undefined) {
        firstMusicAttempt.catch(() => {});
    }

    unlockAudio(eramMusic);

    const recommendationScreen =
        document.getElementById("recommendationScreen");

    const recommendationText =
        document.getElementById("recommendationText");

    startScreen.classList.add("fadeOut");

    setTimeout(() => {
        startScreen.style.display = "none";

        recommendationScreen.classList.add("visible");

        playRecommendations(
            recommendationScreen,
            recommendationText
        );
    }, 1200);
}
function playRecommendations(
    recommendationScreen,
    recommendationText
) {
    const recommendationMessages = [
        "VOLUME UP RECOMMENDED",
        "PC/MacOS ONLY",
        "LOVE RECOMMENDED"
    ];

    let recommendationIndex = 0;

    function typeRecommendation(text, finished) {
        recommendationText.textContent = "";
        recommendationText.classList.remove("hidden");

        let characterIndex = 0;

        function typeNextCharacter() {
            if (characterIndex >= text.length) {
                setTimeout(finished, 1400);
                return;
            }

            recommendationText.textContent +=
                text[characterIndex];

            characterIndex++;

            setTimeout(
                typeNextCharacter,
                65
            );
        }

        typeNextCharacter();
    }

    function showNextRecommendation() {
        if (
            recommendationIndex >=
            recommendationMessages.length
        ) {
            recommendationText.classList.add("hidden");

            setTimeout(() => {
                recommendationScreen.classList.remove("visible");

                setTimeout(() => {
                    recommendationScreen.style.display = "none";

                    /* Reset the real dialogue sequence */
                    currentVoice = 1;
                    messages = firstVoiceMessages;
                    messageIndex = 0;
                    characterIndex = 0;
                    isTyping = false;
                    isTransitioning = false;

                    dialogue.style.display = "block";
                    dialogue.classList.remove("hidden");
                    dialogue.textContent = "";

                    setTimeout(() => {
                        recommendationsActive = false;
                        startFirstVoiceAtmosphere();
                        typeCurrentMessage();
                    }, 350);

                }, 1100);
            }, 1000);

            return;
        }

        typeRecommendation(
            recommendationMessages[recommendationIndex],
            () => {
                recommendationText.classList.add("hidden");

                setTimeout(() => {
                    recommendationIndex++;
                    showNextRecommendation();
                }, 1000);
            }
        );
    }

    setTimeout(
        showNextRecommendation,
        900
    );
}


window.addEventListener("load", () => {
    myCastleMusic.load();
    eramMusic.load();
    textSound.load();
    buildUpSound.load();
    titleSound.load();
    selectSound.load();
    eramTalkingSound.load();
    eramFinishSound.load();
});

startScreen.addEventListener("click", event => {
    event.stopPropagation();

    /*
    Before the title sequence starts, only the save point begins it.
    */
    if (!titleSequenceStarted) {
        if (event.target !== savePointButton) {
            return;
        }

        safelyPlay(selectSound, 0.85);

        /*
        Prewarm the drone from this first user interaction.
        It remains silent until the first voice begins.
        */
        myCastleMusic.loop = true;
        myCastleMusic.volume = 0;

        const droneWarmup =
            myCastleMusic.play();

        if (droneWarmup !== undefined) {
            droneWarmup
                .then(() => {
                    myCastleMusic.pause();
                    myCastleMusic.currentTime = 0;
                })
                .catch(() => {});
        }

        startTitleSequence();
        return;
    }

    /*
    Ignore additional clicks until CLICK TO BEGIN
    has finished typing.
    */
    if (!titleSequenceReady) {
        return;
    }

    /*
    Next click begins the actual experience.
    */
    beginExperience();
});

document.addEventListener("click", event => {
    if (
        event.target.closest("#startScreen") ||
        event.target.closest("#recommendationScreen")
    ) {
        return;
    }

    safelyPlay(selectSound, 0.80);
    advanceDialogue();
});


        document.addEventListener(
            "keydown",
            event => {
                const target = event.target;

                if (
                    target instanceof HTMLInputElement ||
                    target instanceof HTMLTextAreaElement ||
                    target?.isContentEditable
                ) {
                    return;
                }

                if (
                    event.code !== "KeyG" &&
                    event.code !== "KeyE"
                ) {
                    return;
                }

                event.preventDefault();
                event.stopImmediatePropagation();

                safelyPlay(selectSound, 0.80);

                if (event.code === "KeyG") {
                    jumpToFirstVoice();
                } else {
                    jumpToEram();
                }
            },
            true
        );

        document.addEventListener("keydown", event => {
            const validKeys = [
                "Enter",
                "z",
                "Z",
                " ",
                "ArrowRight"
            ];

            if (!validKeys.includes(event.key)) {
                return;
            }

            event.preventDefault();

if (!titleSequenceStarted) {
    startTitleSequence();
    return;
}

if (!titleSequenceReady) {
    return;
}

if (!hasStarted) {
    beginExperience();
    return;
}

            advanceDialogue();
        });
    </script>
