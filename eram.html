<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>...</title>

    <style>
        @font-face {
            font-family: "EramFont";
            src:
                url("assets/Final_Fantasy_I_-_NES.woff2")
                format("woff2");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;

            overflow: hidden;
            background: black;
        }

        body {
            cursor: url("assets/heart.png"), auto;
            user-select: none;
        }

        /*
        Full-page CRT scanlines.
        */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 9997;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.025) 0,
                    rgba(255, 255, 255, 0.025) 1px,
                    rgba(0, 0, 0, 0.10) 2px,
                    rgba(0, 0, 0, 0.10) 4px
                );

            opacity: 0.62;

            animation:
                crtScanMove 7s linear infinite;
        }

        /*
        Slow rolling VCR brightness band.
        */
        body::after {
            content: "";
            position: fixed;
            left: 0;
            top: -35%;
            z-index: 9998;

            width: 100%;
            height: 32%;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(255, 255, 255, 0.018) 24%,
                    rgba(255, 255, 255, 0.055) 48%,
                    rgba(255, 255, 255, 0.018) 72%,
                    transparent 100%
                );

            filter: blur(4px);
            opacity: 0.72;

            animation:
                vcrRoll 6.8s linear infinite;
        }

        #screen {
            position: fixed;
            inset: 0;

            background: black;

            opacity: 0;
            transition: opacity 2s ease;
        }

        #screen.visible {
            opacity: 1;
        }

        #eramDialogue {
            position: absolute;
            top: 4vh;
            left: 2vw;
            z-index: 2;

            width: 94vw;

            opacity: 1;
            transition: opacity 0.65s ease;

            animation:
                eramScreenJitter 5s steps(1, end) infinite,
                eramBrightnessPulse 3.5s ease-in-out infinite;
        }

        #eramDialogue.hidden {
            opacity: 0;
        }

        /*
        Local scanline shimmer over ERAM's dialogue.
        */
        #eramDialogue::after {
            content: "";
            position: absolute;
            inset: -10px;
            z-index: 20;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.020) 0,
                    rgba(255, 255, 255, 0.020) 1px,
                    transparent 2px,
                    transparent 4px
                );

            opacity: 0.52;
            mix-blend-mode: screen;

            animation:
                eramScanShimmer 2.6s linear infinite;
        }

        .eramLayer {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            margin: 0;

            font-family: "EramFont", monospace;
            font-size: clamp(50px, 5vw, 75px);
            font-weight: normal;

            line-height: 1.5;
            letter-spacing: 0.14em;
            text-align: left;
            white-space: pre-wrap;

            pointer-events: none;
            will-change: transform, opacity;
        }

        #eramRed {
            color: rgba(255, 35, 35, 0.48);
            z-index: 1;

            opacity: 0.42;
            mix-blend-mode: screen;

            animation:
                eramRedShift 0.18s steps(2, end) infinite,
                redChannelDrift 3.1s ease-in-out infinite;
        }

        #eramCyan {
            color: rgba(0, 210, 255, 0.44);
            z-index: 2;

            opacity: 0.42;
            mix-blend-mode: screen;

            animation:
                eramCyanShift 0.18s steps(2, end) infinite,
                cyanChannelDrift 2.8s ease-in-out infinite;
        }

        #eramWhite {
            color: rgba(242, 242, 242, 0.90);
            z-index: 3;

            text-shadow:
                0 0 1px rgba(255, 255, 255, 0.78),
                0 0 3px rgba(255, 255, 255, 0.18);

            animation:
                eramWhiteFlicker 0.14s steps(2, end) infinite;
        }

        #whiteTransition {
            position: fixed;
            inset: 0;
            z-index: 9999;

            background: white;

            opacity: 0;
            pointer-events: none;

            transition: opacity 2s ease;
        }

        #whiteTransition.active {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes crtScanMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 12px;
            }
        }

        @keyframes vcrRoll {
            from {
                transform: translateY(-35vh);
            }

            to {
                transform: translateY(150vh);
            }
        }

        @keyframes eramScanShimmer {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 8px;
            }
        }

        @keyframes eramWhiteFlicker {
            0%,
            100% {
                opacity: 1;
            }

            8% {
                opacity: 0.92;
            }

            14% {
                opacity: 1;
            }

            52% {
                opacity: 0.88;
            }

            70% {
                opacity: 1;
            }
        }

        @keyframes eramRedShift {
            0%,
            100% {
                transform: translate(2px, 0);
            }

            50% {
                transform: translate(1px, -1px);
            }
        }

        @keyframes eramCyanShift {
            0%,
            100% {
                transform: translate(-2px, 0);
            }

            50% {
                transform: translate(-1px, 1px);
            }
        }

        @keyframes eramScreenJitter {
            0%,
            96%,
            100% {
                transform: translate(0, 0);
            }

            97% {
                transform: translate(1px, -1px);
            }

            98% {
                transform: translate(-1px, 1px);
            }

            99% {
                transform: translate(1px, 0);
            }
        }

        @keyframes eramBrightnessPulse {
            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.12);
            }
        }

        @keyframes redChannelDrift {
            0%,
            100% {
                margin-left: -2px;
            }

            50% {
                margin-left: -3px;
            }
        }

        @keyframes cyanChannelDrift {
            0%,
            100% {
                margin-left: 2px;
            }

            50% {
                margin-left: 3px;
            }
        }
    </style>
</head>

<body>
    <main id="screen">
        <div id="eramDialogue">
            <p id="eramRed" class="eramLayer"></p>
            <p id="eramCyan" class="eramLayer"></p>
            <p id="eramWhite" class="eramLayer"></p>
        </div>
    </main>

    <div id="whiteTransition"></div>

    <audio id="eramMusic" preload="auto" loop>
        <source
            src="assets/music/eram.mp3"
            type="audio/mpeg"
        >
    </audio>

    <audio id="determinationMusic" preload="auto" loop>
        <source
            src="assets/music/determinationpt1.mp3"
            type="audio/mpeg"
        >
    </audio>

    <audio id="eramTalkingSound" preload="auto">
        <source
            src="assets/sounds/eram-talking.wav"
            type="audio/wav"
        >
    </audio>

    <audio id="eramFinishTalkingSound" preload="auto">
        <source
            src="assets/sounds/eram-finish-talking.wav"
            type="audio/wav"
        >
    </audio>

    <audio id="selectSound" preload="auto">
        <source
            src="assets/sounds/select.wav"
            type="audio/wav"
        >
    </audio>

    <script>
        const screen =
            document.getElementById("screen");

        const eramDialogue =
            document.getElementById("eramDialogue");

        const eramRed =
            document.getElementById("eramRed");

        const eramCyan =
            document.getElementById("eramCyan");

        const eramWhite =
            document.getElementById("eramWhite");

        const whiteTransition =
            document.getElementById("whiteTransition");

        const eramMusic =
            document.getElementById("eramMusic");

        const determinationMusic =
            document.getElementById("determinationMusic");

        const eramTalkingSound =
            document.getElementById("eramTalkingSound");

        const eramFinishTalkingSound =
            document.getElementById(
                "eramFinishTalkingSound"
            );

        const selectSound =
            document.getElementById("selectSound");

        const messages = [
            "How boring. I'm getting bored.\nIsn't this lame, Lopati?",

            "...\n...?\nFine.",

            "I'll admit that you're right\nto be curious.\nI forgot you were a game designer.",

            "Unlike the other human...\nI guess I don't know you very well.",

            "I tried to ask HIM about you.\nHe told me he didn't know you too well\neither.",

            "...\nYou know...\nSometimes, I like it better like that.",

            "This feeling...\nThis confusion mixed with excitement...\n\nThe attention we have of each other,\nso heavy and uniquely intense that it\nrivals the highest forms of worship...",

            "It could convince anyone\nthat, sometimes?\n\nIt's better to be in the dark\nabout things.",

            "Let me show you\nwhat you humans unveiled from the shadows."
        ];

        const typingSpeed = 45;
        const transitionPause = 650;

        let messageIndex = 0;
        let characterIndex = 0;
        let typingTimer = null;

        let isTyping = false;
        let isTransitioning = false;
        let leavingPage = false;

        let eramMusicStarted = false;
        let determinationStarted = false;
        let eramFadeStarted = false;

        function safelyPlay(
            audio,
            volume = 1,
            restart = true
        ) {
            if (!audio) {
                return;
            }

            audio.volume = volume;

            if (restart) {
                audio.currentTime = 0;
            }

            const attempt = audio.play();

            if (attempt !== undefined) {
                attempt.catch(() => {});
            }
        }

        function fadeAudio(
            audio,
            targetVolume,
            duration,
            pauseWhenDone = false
        ) {
            if (!audio) {
                return;
            }

            if (audio._fadeTimer) {
                clearInterval(audio._fadeTimer);
            }

            const startVolume = audio.volume;
            const difference =
                targetVolume - startVolume;

            const startedAt =
                performance.now();

            audio._fadeTimer =
                setInterval(() => {
                    const elapsed =
                        performance.now() -
                        startedAt;

                    const progress =
                        Math.min(
                            elapsed / duration,
                            1
                        );

                    audio.volume =
                        Math.max(
                            0,
                            Math.min(
                                1,
                                startVolume +
                                difference *
                                progress
                            )
                        );

                    if (progress >= 1) {
                        clearInterval(
                            audio._fadeTimer
                        );

                        audio._fadeTimer = null;

                        if (
                            pauseWhenDone &&
                            targetVolume === 0
                        ) {
                            audio.pause();
                            audio.currentTime = 0;
                        }
                    }
                }, 40);
        }

        function startEramMusic() {
            if (eramMusicStarted) {
                return;
            }

            eramMusicStarted = true;

            eramMusic.pause();
            eramMusic.currentTime = 0;
            eramMusic.loop = true;
            eramMusic.volume = 0;

            const attempt =
                eramMusic.play();

            if (attempt !== undefined) {
                attempt
                    .then(() => {
                        fadeAudio(
                            eramMusic,
                            0.50,
                            3500
                        );
                    })
                    .catch(() => {
                        eramMusicStarted = false;
                    });
            }
        }

        function fadeOutEramMusic() {
            if (eramFadeStarted) {
                return;
            }

            eramFadeStarted = true;

            fadeAudio(
                eramMusic,
                0,
                3200,
                true
            );
        }

        function startDeterminationMusic() {
            if (determinationStarted) {
                return;
            }

            determinationStarted = true;

            determinationMusic.pause();
            determinationMusic.currentTime = 0;
            determinationMusic.loop = true;
            determinationMusic.volume = 0;

            const attempt =
                determinationMusic.play();

            if (attempt !== undefined) {
                attempt
                    .then(() => {
                        fadeAudio(
                            determinationMusic,
                            0.55,
                            4500
                        );
                    })
                    .catch(() => {
                        determinationStarted = false;
                    });
            }
        }

        function playTalkingBleep(character) {
            if (
                character === " " ||
                character === "\n"
            ) {
                return;
            }

            safelyPlay(
                eramTalkingSound,
                0.58
            );
        }

        function clearDialogue() {
            eramRed.textContent = "";
            eramCyan.textContent = "";
            eramWhite.textContent = "";
        }

        function addCharacter(character) {
            eramRed.textContent += character;
            eramCyan.textContent += character;
            eramWhite.textContent += character;
        }

        function showCompleteMessage() {
            const message =
                messages[messageIndex];

            eramRed.textContent = message;
            eramCyan.textContent = message;
            eramWhite.textContent = message;

            characterIndex = message.length;
            isTyping = false;
        }

        function prepareMusicForMessage() {
            if (messageIndex === 5) {
                fadeOutEramMusic();
            }

            if (messageIndex === 6) {
                startDeterminationMusic();
            }
        }

        function typeCurrentMessage() {
            clearTimeout(typingTimer);
            clearDialogue();

            eramDialogue.classList.remove(
                "hidden"
            );

            characterIndex = 0;
            isTyping = true;

            prepareMusicForMessage();

            const message =
                messages[messageIndex];

            function typeNextCharacter() {
                if (
                    characterIndex >=
                    message.length
                ) {
                    isTyping = false;

                    safelyPlay(
                        eramFinishTalkingSound,
                        0.72
                    );

                    return;
                }

                const character =
                    message[characterIndex];

                addCharacter(character);
                playTalkingBleep(character);

                characterIndex++;

                typingTimer =
                    setTimeout(
                        typeNextCharacter,
                        typingSpeed
                    );
            }

            typeNextCharacter();
        }

        function leaveForPage4() {
            if (leavingPage) {
                return;
            }

            leavingPage = true;

            eramDialogue.classList.add(
                "hidden"
            );

            fadeAudio(
                determinationMusic,
                0,
                1700,
                true
            );

            fadeAudio(
                eramMusic,
                0,
                1700,
                true
            );

            setTimeout(() => {
                whiteTransition.classList.add(
                    "active"
                );
            }, 350);

            setTimeout(() => {
                window.location.href =
                    "page4.html";
            }, 2450);
        }

        function advanceDialogue() {
            if (
                isTransitioning ||
                leavingPage
            ) {
                return;
            }

            safelyPlay(
                selectSound,
                0.85
            );

            if (isTyping) {
                clearTimeout(typingTimer);
                showCompleteMessage();
                return;
            }

            isTransitioning = true;

            eramDialogue.classList.add(
                "hidden"
            );

            setTimeout(() => {
                messageIndex++;

                if (
                    messageIndex >=
                    messages.length
                ) {
                    leaveForPage4();
                    return;
                }

                typeCurrentMessage();
                isTransitioning = false;
            }, transitionPause);
        }

        function ensureMusicStarted() {
            if (
                !eramMusicStarted &&
                messageIndex < 5
            ) {
                startEramMusic();
            }
        }

        window.addEventListener(
            "load",
            () => {
                requestAnimationFrame(() => {
                    screen.classList.add(
                        "visible"
                    );
                });

                startEramMusic();

                setTimeout(
                    typeCurrentMessage,
                    1500
                );
            }
        );

        document.addEventListener(
            "click",
            () => {
                ensureMusicStarted();
                advanceDialogue();
            }
        );

        document.addEventListener(
            "keydown",
            event => {
                const validKeys = [
                    "Enter",
                    "z",
                    "Z"
                ];

                if (
                    !validKeys.includes(
                        event.key
                    )
                ) {
                    return;
                }

                event.preventDefault();

                ensureMusicStarted();
                advanceDialogue();
            }
        );
    </script>
</body>

</html>
